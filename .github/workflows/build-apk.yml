name: Build FastFlow Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependências do projeto
        run: npm install

      - name: 5. Preparar arquivos web (dist/)
        run: npm run build

      - name: 6. Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: 7. Permissão de execução para o Gradle
        run: chmod +x ./android/gradlew

      - name: 8. Compilar APK Nativo (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 9. Publicar APK para Download (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: FastFlow-v3-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
