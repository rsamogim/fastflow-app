<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#0A0C0F"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA8"/>
      <stop offset="100%" stop-color="#00B383"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados (estilo app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Borda sutil -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Trilho circular de fundo -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E232D" stroke-width="28"/>

  <!-- Anel de Jejum Ativo (Mint Glow) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#mintGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="260" transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Ícone Central: Chama & Ampulheta Estilizada -->
  <g transform="translate(256, 256)">
    <!-- Brilho de fundo -->
    <circle cx="0" cy="0" r="70" fill="#00E0A4" fill-opacity="0.1" />

    <!-- Chama minimalista -->
    <path d="M0 -72 C22 -35, 52 -10, 52 28 C52 64, 28 88, 0 88 C-28 88, -52 64, -52 28 C-52 -10, -22 -35, 0 -72 Z" fill="url(#mintGrad)"/>
    
    <!-- Núcleo quente interno -->
    <path d="M0 -24 C10 -6, 22 8, 22 30 C22 46, 12 56, 0 56 C-12 56, -22 46, -22 30 C-22 8, -10 -6, 0 -24 Z" fill="url(#amberGrad)"/>
  </g>
</svg>
